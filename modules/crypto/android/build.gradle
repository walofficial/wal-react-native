buildscript {
  ext.safeExtGet = {prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
  repositories {
    google()
    gradlePluginPortal()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:7.3.1")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

android {
  compileSdkVersion safeExtGet('compileSdkVersion', 34)
  namespace "com.rtncrypto"
  ndkVersion safeExtGet('ndkVersion', "27.1.12297006")
  
  buildFeatures {
    prefab true
  }
  
  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-fexceptions", "-frtti", "-std=c++17"
        abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
      }
    }
  }
  
  externalNativeBuild {
    cmake {
      path "src/main/jni/CMakeLists.txt"
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation 'com.facebook.react:react-native'
  // libsodium is linked natively via CMake from vendor/android/
  // Run: ./modules/crypto/scripts/setup-libsodium-android.sh
}
